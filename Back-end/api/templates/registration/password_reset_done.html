{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md border border-gray-100 text-center">
        <div class="text-green-500 mb-4 flex justify-center">
            <!-- Ícone de Check -->
            <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">E-mail Enviado!</h2>
        <p class="text-gray-600 mb-6">Verifique sua caixa de entrada. Você receberá um link para redefinir sua senha.</p>
        <a href="{% url 'login' %}" class="inline-block bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded transition">Voltar ao Login</a>
    </div>
</div>
{% endblock %}
