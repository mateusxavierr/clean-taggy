<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Clean Taggy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-8">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Crie sua conta</h2>
            <p class="text-gray-500 mt-2">Junte-se à Clean Taggy e comece a medir seu impacto</p>
        </div>

        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>
                
                {{ field }}
                
                {% if field.errors %}
                <!-- Tratamento visual de erro individual focado na usabilidade, sem quebrar o layout -->
                <p class="text-red-500 text-xs italic mt-1 font-medium">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150 ease-in-out mt-6">
                Cadastrar
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Já tem uma conta? 
                <a href="{% url 'login' %}" class="text-green-600 hover:text-green-500 font-medium">Faça login</a>
            </p>
        </div>
    </div>
</body>
</html>
