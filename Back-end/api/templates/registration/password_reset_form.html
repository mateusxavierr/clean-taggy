{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Recuperar Senha</h2>
        <p class="text-sm text-gray-600 text-center mb-6">Digite seu e-mail cadastrado e enviaremos as instruções para você criar uma nova senha.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email" class="block text-gray-700 text-sm font-bold mb-2">E-mail:</label>
                <input type="email" name="email" id="id_email" required autocomplete="email" autofocus
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:border-green-500">
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition">
                Enviar E-mail de Recuperação
            </button>
        </form>
        <div class="mt-4 text-center">
            <a href="{% url 'login' %}" class="text-sm text-blue-600 hover:text-blue-800">Voltar para o Login</a>
        </div>
    </div>
</div>
{% endblock %}
