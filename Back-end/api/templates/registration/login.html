{% extends 'api/base.html' %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-140px)] px-4 py-12">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-8">
            <div class="inline-flex bg-emerald-100 p-3 rounded-2xl mb-4">
                <i data-lucide="leaf" class="h-8 w-8 text-emerald-600"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Acesse sua conta</h2>
            <p class="text-gray-500 mt-2">Monitore seu impacto ambiental com a Clean Taggy.</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-medium border border-red-100">
                Usuário ou senha incorretos. Tente novamente.
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Usuário</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                    <input type="text" name="username" required placeholder="Ex: gabriel_teste" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 pl-12 pr-4 text-sm font-medium focus:border-emerald-500 focus:ring-2 focus:ring-emerald-50 focus:outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Senha</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 pl-12 pr-4 text-sm font-medium focus:border-emerald-500 focus:ring-2 focus:ring-emerald-50 focus:outline-none transition-all">
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-600 text-white font-bold rounded-xl py-3.5 hover:bg-emerald-700 transition-colors shadow-sm">
                Entrar
            </button>
        </form>
    </div>
</div>
{% endblock %}
