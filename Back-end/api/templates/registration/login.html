<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clean Taggy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input-field {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
            margin-top: 0.25rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .input-field:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 1px #22c55e;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Bem-vindo de volta</h2>
            <p class="text-gray-500 mt-2">Acesse sua conta para ver seu impacto ambiental</p>
        </div>

        {% if form.errors %}
        <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-md">
            <p class="text-sm text-red-700 font-medium">Usuário ou senha incorretos. Tente novamente.</p>
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{% url 'dashboard' %}">
            
            <div class="mb-4">
                <label for="id_username" class="block text-gray-700 text-sm font-bold">Usuário</label>
                <input type="text" name="username" id="id_username" class="input-field" required>
            </div>
            
            <div class="mb-6">
                <label for="id_password" class="block text-gray-700 text-sm font-bold">Senha</label>
                <input type="password" name="password" id="id_password" class="input-field" required>
            </div>
            
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                Entrar
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Ainda não tem uma conta? 
                <a href="{% url 'register' %}" class="text-green-600 hover:text-green-500 font-medium">Cadastre-se</a>
            </p>
        </div>
    </div>
</body>
</html>
