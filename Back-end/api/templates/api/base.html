<!DOCTYPE html>
<html lang="pt-br" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Taggy</title>
    
    <!-- Tailwind CSS (via CDN para manter o seu padrão) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Typography-first (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Ícones Minimalistas (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Scrollbar elegante para combinar com o Bento Grid */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
    </style>
</head>
<body class="h-full flex flex-col antialiased text-gray-900 bg-[#F8F9FA]">

    <!-- Navbar Typography-First & Bento Style -->
    <nav class="bg-white border-b border-gray-200/60 sticky top-0 z-40 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.02)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                
                <!-- Lado Esquerdo: Logo & Menu Desktop -->
                <div class="flex items-center gap-8">
                    <a href="{% url 'dashboard' %}" class="flex items-center gap-2.5 shrink-0 group">
                        <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center group-hover:scale-105 transition-transform">
                            <i data-lucide="leaf" class="w-4 h-4 text-[#00E599]"></i>
                        </div>
                        <span class="font-black text-lg tracking-tight text-black hidden sm:block">Clean Taggy</span>
                    </a>
                    
                    <!-- Links Principais (Estilo Pílula para aba ativa) -->
                    <div class="hidden md:flex items-center gap-2">
                        <a href="{% url 'dashboard' %}" class="px-3 py-1.5 rounded-md text-[13px] font-bold transition-all {% if request.resolver_match.url_name == 'dashboard' %}bg-black text-white shadow-sm{% else %}text-gray-500 hover:text-black hover:bg-gray-100{% endif %}">
                            Visão Geral
                        </a>
                        <a href="{% url 'history' %}" class="px-3 py-1.5 rounded-md text-[13px] font-bold transition-all {% if request.resolver_match.url_name == 'history' %}bg-black text-white shadow-sm{% else %}text-gray-500 hover:text-black hover:bg-gray-100{% endif %}">
                            Histórico
                        </a>
                        <a href="{% url 'sustainability' %}" class="px-3 py-1.5 rounded-md text-[13px] font-bold transition-all {% if request.resolver_match.url_name == 'sustainability' %}bg-black text-white shadow-sm{% else %}text-gray-500 hover:text-black hover:bg-gray-100{% endif %}">
                            Sustentabilidade
                        </a>
                        <a href="{% url 'community' %}" class="px-3 py-1.5 rounded-md text-[13px] font-bold transition-all {% if request.resolver_match.url_name == 'community' %}bg-black text-white shadow-sm{% else %}text-gray-500 hover:text-black hover:bg-gray-100{% endif %}">
                            Comunidade
                        </a>
                    </div>
                </div>

                <!-- Lado Direito: Perfil & Botão Mobile -->
                <div class="flex items-center gap-4">
                    <a href="{% url 'profile' %}" class="hidden md:flex items-center gap-2 pl-3 pr-1 py-1 rounded-full border border-gray-200/60 hover:border-gray-300 bg-[#F8F9FA] hover:bg-white transition-all cursor-pointer">
                        <span class="text-[12px] font-bold text-black uppercase tracking-widest">{{ request.user.first_name|default:request.user.username }}</span>
                        <div class="w-7 h-7 rounded-full bg-white border border-gray-200 flex items-center justify-center overflow-hidden shrink-0">
                            <img src="https://ui-avatars.com/api/?name={{ request.user.first_name|default:request.user.username }}&background=random&color=fff&bold=true" alt="Perfil" class="w-full h-full object-cover">
                        </div>
                    </a>

                    <!-- Botão Menu Hamburguer (Mobile) -->
                    <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden p-2 text-gray-400 hover:text-black transition-colors rounded-lg hover:bg-gray-100">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                </div>

            </div>
        </div>

        <!-- Menu Dropdown para Mobile -->
        <div id="mobile-menu" class="hidden md:hidden border-t border-gray-100 bg-white shadow-lg absolute w-full">
            <div class="px-4 pt-2 pb-4 space-y-1">
                <a href="{% url 'dashboard' %}" class="block px-3 py-2.5 rounded-lg text-[13px] font-bold uppercase tracking-widest {% if request.resolver_match.url_name == 'dashboard' %}bg-black text-white{% else %}text-gray-500 hover:text-black hover:bg-gray-50{% endif %}">Visão Geral</a>
                <a href="{% url 'history' %}" class="block px-3 py-2.5 rounded-lg text-[13px] font-bold uppercase tracking-widest {% if request.resolver_match.url_name == 'history' %}bg-black text-white{% else %}text-gray-500 hover:text-black hover:bg-gray-50{% endif %}">Histórico</a>
                <a href="{% url 'sustainability' %}" class="block px-3 py-2.5 rounded-lg text-[13px] font-bold uppercase tracking-widest {% if request.resolver_match.url_name == 'sustainability' %}bg-black text-white{% else %}text-gray-500 hover:text-black hover:bg-gray-50{% endif %}">Sustentabilidade</a>
                <a href="{% url 'community' %}" class="block px-3 py-2.5 rounded-lg text-[13px] font-bold uppercase tracking-widest {% if request.resolver_match.url_name == 'community' %}bg-black text-white{% else %}text-gray-500 hover:text-black hover:bg-gray-50{% endif %}">Comunidade</a>
                <a href="{% url 'profile' %}" class="block px-3 py-2.5 rounded-lg text-[13px] font-bold uppercase tracking-widest {% if request.resolver_match.url_name == 'profile' %}bg-black text-white{% else %}text-gray-500 hover:text-black hover:bg-gray-50{% endif %}">Meu Perfil</a>
            </div>
        </div>
    </nav>

    <!-- Área Principal das Telas -->
    <main class="flex-1 flex flex-col w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé (Footer Institucional) -->
    <footer class="border-t border-gray-200/60 bg-white mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-[#F8F9FA] rounded-md border border-gray-200 flex items-center justify-center">
                    <i data-lucide="leaf" class="w-3 h-3 text-black"></i>
                </div>
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">&copy; {% now "Y" %} Clean Taggy</p>
            </div>
            <div class="flex items-center gap-6">
                <a href="{% url 'about' %}" class="text-[11px] font-bold text-gray-400 hover:text-black uppercase tracking-widest transition-colors">Sobre</a>
                <a href="{% url 'privacy' %}" class="text-[11px] font-bold text-gray-400 hover:text-black uppercase tracking-widest transition-colors">Privacidade</a>
                <a href="{% url 'terms' %}" class="text-[11px] font-bold text-gray-400 hover:text-black uppercase tracking-widest transition-colors">Termos Legais</a>
            </div>
        </div>
    </footer>

    <!-- Iniciação Global dos Ícones -->
    <script>lucide.createIcons();</script>
</body>
</html>
